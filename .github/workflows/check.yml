name: Application checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task --config supabase/functions/deno.json check
      - run: deno task --config supabase/functions/deno.json test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npx expo export --platform all --max-workers 2
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      - run: node scripts/verify-web-export.cjs
